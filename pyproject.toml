[project]
name = "deckforge"
version = "0.1.0"
description = "Генерация презентаций по .pptx-шаблону (кейс VK Tech, ЛЦТ 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # Пока не импортируется нигде в src/ — слой ooxml/ (Task 2) читает .pptx
    # сам, напрямую по lxml, без python-pptx. Понадобится в задаче сборки
    # готовой презентации (запись .pptx с заполненным контентом), которая
    # встанет поверх этого слоя. Оставлена в зависимостях заранее, чтобы
    # не тянуть отдельный PR только ради добавления пакета.
    "python-pptx>=1.0",
    "lxml>=5.0",
    "pillow>=10.0",
]

[project.scripts]
deckforge = "deckforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deckforge"]

[tool.pytest.ini_options]
markers = [
    "live: тест ходит в сеть к живому провайдеру, требует YANDEX_API_KEY",
]
