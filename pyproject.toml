[project]
name = "deckforge"
version = "0.1.0"
description = "Генерация презентаций по .pptx-шаблону (кейс VK Tech, ЛЦТ 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-pptx>=1.0",
    "lxml>=5.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deckforge"]

[tool.pytest.ini_options]
markers = [
    "live: тест ходит в сеть к живому провайдеру, требует YANDEX_API_KEY",
]
