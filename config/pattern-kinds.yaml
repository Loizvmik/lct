# Словарь видов раскладки (`Pattern.kind`), которые умеет различать
# мультимодальный разбор шаблона (task-18-brief: "Распознавание схлопывает
# виды... покажи ей отрисованные слайды-примеры шаблона").
#
# Геометрический майнинг (`template/patterns.py::_classify_kind`) различает
# только семь корзин (`cards`/`two_col`/`kpi`/`section`/`image`/`table`/
# `bullets`) — правилами формы (повтор, колонки, площадь картинки), без
# понимания СМЫСЛА композиции. Слайд с цитатой, слайд-фактоид с крупной
# подписью, слайд с фото/мокапом и текстом рядом — геометрически неотличимы
# от обычного текстового слайда (один крупный текстовый блок) и схлопываются
# в `section`/`bullets`. Модель (`template/vision_kind.py`) смотрит на
# ОТРИСОВАННУЮ картинку слайда-примера и предлагает вид из ЭТОГО списка —
# код проверяет предложение (вид вне списка отвергается, геометрический
# `kind` остаётся как есть), тот же принцип "модель предлагает, код
# проверяет", что уже применён для ролей палитры (`naming.py`) и словаря
# имён макетов (`layout-kinds.yaml`, тот же принцип конфиг-файла, а не
# зашитого в код списка).
#
# `id` — то же значение, что ложится в `Pattern.kind` (и дальше в
# `plan.spec.SLIDE_KINDS`, план ссылается на этот список по смыслу, не по
# импорту — тот же приём, что уже документирован в `plan/spec.py`).
# `description` — короткая формулировка, которую видит МОДЕЛЬ (собирается в
# промпт `agents/pattern-kind-vision/AGENT.md` кодом, не хардкодом внутри
# самого промпта) — задача конфига в том, чтобы расширение словаря видов не
# требовало правки кода вовсе, только этого файла.
#
# Первые семь — существующие геометрические корзины (модель может
# подтвердить их тоже, если геометрия и так права — не заставляет её всегда
# находить что-то новое). Последние три — новые виды этой задачи (минимум
# из брифа: "добавь как минимум цитату, фото с текстом, крупный фактоид с
# подписью").
#
# `version` (Task 15, версионирование конфигов воркфлоу) — поднимается при
# правке словаря, читается `deckforge.workflow.versions.manifest()`.
version: 1.0.0

kinds:
  - id: cards
    description: "Ряд или сетка из нескольких (3+) одинаковых карточек — у каждой своя рамка, обычно заголовок и/или короткий текст."
  - id: two_col
    description: "Две колонки текста рядом — сравнение, до/после, левое и правое."
  - id: kpi
    description: "Несколько (2+) метрик-цифр в ряд/сетке, у каждой крупное число и короткая подпись под ним."
  - id: section
    description: "Героический слайд-разделитель — один крупный заголовок (и, может быть, подзаголовок), почти без другого содержания."
  - id: image
    description: "Слайд, где смысл целиком несёт картинка или график на большую часть холста — текста почти нет."
  - id: table
    description: "Таблица со строками и столбцами."
  - id: bullets
    description: "Заголовок и один связный текстовый блок или список пунктов — обычная текстовая раскладка без цитаты, фото или крупной цифры."
  - id: quote
    description: "Цитата — крупный текст высказывания (часто в кавычках или курсивом), может быть с именем автора/источника рядом."
  - id: photo_text
    description: "Фотография, фотоколлаж или мокап устройства (телефон/ноутбук на экране) РЯДОМ с текстом — не героическая картинка на весь холст (это `image`), а фото и текст оба несут смысл слайда сообща."
  - id: kpi_caption
    description: "ОДНО крупное число (не сетка из нескольких метрик — это `kpi`) с развёрнутой текстовой подписью-пояснением рядом или под ним — героический фактоид, не панель метрик."
