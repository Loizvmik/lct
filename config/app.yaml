# Единственная точка настройки DeckForge (ТЗ требует воспроизводимый сетап
# конфиг-файлом). Секреты (ключ и id каталога Yandex) сюда не попадают —
# они читаются только из .env, см. .env.example.
#
# `version` (Task 15, ТЗ п.2.4 «версионирование конфигов, лежащих в основе
# воркфлоу») — поднимается вручную при содержательной правке (новая роль,
# другой дедлайн/параллелизм), читается `deckforge.workflow.versions.
# manifest()`; `Settings` эту секцию игнорирует (pydantic по умолчанию не
# падает на незнакомых полях), так что версия не мешает загрузке приложения.
# 1.0.0 -> 1.1.0: задача "разбор незнакомого шаблона в бюджет" — новый
# параметр параллелизма `llm.pattern_kind_max_workers` (см. его комментарий
# ниже), ровно тот случай, который докстрока выше называет содержательной
# правкой ("новая роль, другой дедлайн/параллелизм").
# 1.1.0 -> 1.2.0: продолжение той же задачи после живого замера, показавшего
# 187.5с/183.0с вместо цели 60с — новый параметр `render.pattern_kind_dpi`
# (см. его комментарий в `render:` ниже).
# 1.2.0 -> 1.3.0: Task 19 ("настоящий агент вместо одиночного вызова") —
# новый параметр `llm.slide_writer_agent_max_steps` (см. его комментарий
# ниже) — бюджет сетевых кругов агентного цикла письма текста слайдов.
# 1.3.0 -> 1.4.0: Task 20 (встраивание пользовательских фотографий) —
# новая роль `photo_picker` в `llm.roles` ниже: распределяет фотографии
# контент-пакета по слайдам, один вызов модели на колоду (см. `plan.
# photos.assign_photos`).
# 1.4.0 -> 1.5.0: задача D (переранжирование раскладок моделью для
# вариантов airy и visual) — новые параметры `llm.pattern_picker_*` (дедлайн
# вызова, параллелизм, бюджет всего шага) и выключатель `plan.rerank_variants`.
# 1.5.0 -> 1.6.0: задача H (бюджет времени прогона): новый раздел `run:`
# с общим бюджетом, порогами деградации и отбором рискованных слайдов под
# аудит по картинке.
# 1.6.0 -> 1.7.0: задача F (схема слотов раскладки от модели при разборе
# шаблона) — новая роль `pattern_schema` и её параллелизм
# `llm.pattern_schema_max_workers`.
# 1.7.0 -> 1.8.0: задача L (режимы прогона вместо решений «на лету») —
# `run.rerank_min_remaining`/`run.visual_audit_min_remaining`/`run.visual_
# audit_max_slides` заменены таблицей `run.modes` (FULL/FAST/EMERGENCY).
version: 1.8.0

llm:
  provider: yandex
  # Модель по умолчанию для ролей, не перечисленных явно в roles.
  model: qwen3.6-35b-a3b
  # Дедлайн одного вызова complete()/ask_image() по wall-clock (секунды):
  # считает и HTTP-ретраи, и эскалации бюджета max_tokens внутри одного
  # вызова (см. yandex.py) — без этого худший случай был 12 сетевых попыток
  # и десятки минут на одном вызове.
  #
  # Откуда число: ТЗ отводит 300с на колоду 10-15 слайдов, вызовов за колоду
  # десятки (структура, текст и подбор паттерна на слайд, 11 вопросов
  # аудита на слайд). 300 / 10 (нижняя граница "десятков") = 30с — средний
  # бюджет на вызов, не выходя за бюджет колоды. Но живой замер (см.
  # task-1-report.md) показал, что честная (не зависшая) генерация на
  # потолке max_tokens=8192 занимает до 72.3с, а на сниженном потолке 6144
  # (см. MAX_TOKENS_BUDGET_CAP в yandex.py) — до ~54с по той же измеренной
  # скорости генерации (~113 ток/с в худшем прогоне). Дедлайн ниже этого
  # обрубал бы легитимный небыстрый ответ, приняв его за зависший ретрай.
  # 60с — с запасом покрывает измеренный легитимный худший случай (~54с) и
  # всё ещё ограничивает единичный вызов ~20% бюджета колоды, а не половиной
  # часа при худшем сценарии ретраев+эскалаций.
  deadline_seconds: 60.0
  # Число слайдов, чей текст пишется ОДНОВРЕМЕННО (`plan.writer.write_slides`,
  # `ThreadPoolExecutor`) — слайды друг от друга не зависят (свой пункт
  # структуры, свои источники), а живой замер (`task-12-report.md`) показал,
  # что именно последовательное написание текста — 273.7с из 302.8с всей
  # генерации (90%, 23с на слайд) — было тем, что топило пятиминутный бюджет
  # ТЗ. Не "чем больше, тем быстрее": Yandex Cloud не любит слишком много
  # одновременных запросов, и нужен запас надёжности (сетевые ретраи на
  # КАЖДЫЙ параллельный вызов остаются внутри его собственного deadline_
  # seconds, но много параллельных ретраев разом — риск получить 429 сразу
  # у всех). 4 — тот же порядок величины, что уже проверен живьём в
  # визуальном аудите по картинке (`audit.visual.run_visual`, тоже
  # `ThreadPoolExecutor(max_workers=4)`, тот же провайдер), не гадание с нуля.
  slide_writer_max_workers: 4
  # Task 19: сколько сетевых кругов агентного цикла письма текста слайдов
  # (`plan.writer._write_with_agent_loop`) разрешено ОДНОМУ слайду — модель
  # пишет и, если сомневается, вызывает инструменты (замер вместимости
  # слота/проверка цифры в источниках), видит результат и переписывает
  # короче; на последнем шаге код требует финальный ответ независимо от
  # исхода ("не уложилась — отдаёт что есть, находка остаётся аудиту").
  # 2 — буквально число из брифа задачи ("Цикл ограничен двумя шагами").
  # Слайд, написанный уверенно с первого раза (без вызова инструмента),
  # по-прежнему стоит один сетевой вызов, как и до этой задачи — цикл не
  # удорожает уже хороший случай.
  slide_writer_agent_max_steps: 2
  # Ремонт недобора: если крупнейшее текстовое место слайда заполнено
  # меньше чем на половину цели (цель — 0,8 вместимости места), писателю
  # один раз возвращают слайд с просьбой дописать по источникам. Один круг,
  # дедлайн тот же, что у письма. `max_items` ограничивает ремонт слайдами
  # с малым числом элементов; 0 — без ограничения.
  # 2, а не 0: замер 26 сентября 2026 на VK Education (queue-latency,
  # колода прошлого прогона) — четыре слайда по четыре карточки, ремонт
  # поднял заполнение с 0,08–0,15 до 0,31–0,54, но занял 55с стены при
  # четырёх потоках (два вызова по 50–55с). Больше 40с на колоду — дорого
  # при бюджете 300с, поэтому ремонт только для слайдов с одним-двумя
  # элементами, где пустота заметнее всего.
  slide_writer_fill_repair: true
  slide_writer_fill_repair_max_items: 2
  # Задача "разбор незнакомого шаблона в бюджет" (находка №4) — то же самое
  # для уточнения вида раскладки по картинке слайда-примера (`template.
  # vision_kind.classify_patterns_by_vision`), тот же принцип и тот же
  # порядок величины, что у slide_writer_max_workers выше (один и тот же
  # провайдер Yandex Cloud, не "чем больше, тем быстрее" — запас на сетевые
  # ретраи каждого параллельного вызова важнее скорости самого первого
  # разбора). Раньше это было хардкод-константой модуля
  # (`vision_kind.DEFAULT_MAX_WORKERS`), теперь настройка.
  # 4 -> 8: та же задача, вторая попытка (живой замер, см. докстроку
  # `DEFAULT_MAX_WORKERS` в vision_kind.py) — после возврата размера пачки
  # к 1 девять неуверенных паттернов контрольного файла при 4 воркерах шли
  # 3 последовательными раундами; при 8 почти всегда укладываются в один.
  pattern_kind_max_workers: 8
  # Задача D: переранжирование раскладок моделью (`plan.writer.rerank_
  # patterns`) — по вызову на содержательный слайд вариантов airy и visual,
  # то есть два десятка коротких вызовов на колоду, а колода и так близка к
  # 300с ТЗ. Поэтому у шага свой, короткий дедлайн вызова: выбор одного из
  # трёх кандидатов — не письмо текста, и вызов, не уложившийся в 20с,
  # дешевле заменить первым кандидатом кода, чем ждать общие 60с.
  # Параллелизм — как у `pattern_kind_max_workers` (тот же провайдер, та же
  # короткая форма вызова). Бюджет всего шага: что не ответило за 40с,
  # остаётся на выборе кода, генерация не ждёт отстающих.
  # Задача F: схема слотов (`template.vision_kind.describe_pattern_slots`)
  # — по вызову на КАЖДЫЙ паттерн шаблона (их десятки), а не только на
  # неуверенные, как у вида раскладки. Идёт параллельно с ним в разборе,
  # который в пятиминутный бюджет генерации не входит. 4, а не 8, как у
  # вида раскладки: живой прогон 26 сентября 2026 с 8 потоками поверх его 8
  # упёрся в 429 у половины вызовов (см. `vision_kind.DEFAULT_SCHEMA_MAX_WORKERS`).
  pattern_schema_max_workers: 4
  pattern_picker_deadline_seconds: 20.0
  pattern_picker_max_workers: 8
  pattern_picker_step_budget_seconds: 40.0
  # Какая модель отвечает за какую роль конвейера. Разнесено по ролям заранее,
  # чтобы в следующих задачах можно было переключить конкретную роль на другую
  # модель из config/models.yaml, не трогая код.
  roles:
    outline: qwen3.6-35b-a3b
    writer: qwen3.6-35b-a3b
    pattern_picker: qwen3.6-35b-a3b
    palette_namer: qwen3.6-35b-a3b
    content_audit: qwen3.6-35b-a3b
    # Task 18: уточнение вида раскладки (Pattern.kind) по картинке слайда-
    # примера (template/vision_kind.py) — нужна мультимодальная модель, тот
    # же критерий, что и у content_audit (см. её выбор ниже).
    pattern_kind: qwen3.6-35b-a3b
    # Task 20: распределение фотографий контент-пакета по слайдам
    # (`plan.photos.assign_photos`) — текстовая роль (имена файлов и
    # подписи, не сами изображения), той же модели, что и остальной
    # конвейер, достаточно.
    photo_picker: qwen3.6-35b-a3b
    # Задача F: схема слотов раскладки по превью слайда-примера
    # (что это за место и что туда писать) — мультимодальная роль, та же
    # модель, что у `pattern_kind`.
    pattern_schema: qwen3.6-35b-a3b

paths:
  workspace: workspace
  artifacts: artifacts
  # Диск-кеш TemplateProfile.from_file, ключ — отпечаток файла (fingerprint,
  # sha256 содержимого .pptx). Оркестратор генерации (следующие задачи)
  # будет дёргать from_file на каждую колоду; без кеша каждый вызов на том
  # же шаблоне заново платит и разбор (доли секунды), и сетевой вызов
  # именования палитры (~10-20с) — из бюджета в 300с на колоду, где разбор
  # лишь первый шаг из шести. Повторный вызов на неизменившемся файле читает
  # готовый профиль отсюда, минуя и разбор, и сеть.
  profile_cache: cache/profiles

render:
  # Путь к бинарнику soffice. Если не задан — автопоиск по типичным путям
  # macOS (Homebrew, /Applications) и через PATH.
  soffice_path: null
  # dpi рендера слайдов-примеров под уточнение вида раскладки моделью
  # (`template.vision_kind`) — см. обоснование и живой замер в докстроке
  # `RenderConfig.pattern_kind_dpi` (settings.py) и в докстроке
  # `render.soffice` про выборочный рендер страниц. Не трогает превью в
  # интерфейсе/экспорте — те по-прежнему рендерятся дефолтным dpi `to_pngs`
  # (110), эта настройка только для этой конкретной роли.
  pattern_kind_dpi: 72

plan:
  # Задача D: для вариантов airy и visual код отбирает три лучшие раскладки
  # слайда, а модель выбирает из них одну по смыслу (`plan.writer.rerank_
  # patterns`). false — выбор чисто детерминированный, как раньше.
  rerank_variants: true

compose:
  # Слайд собирается клоном подходящего слайда-примера шаблона: группы,
  # градиенты, фото-контейнеры, стрелки и форматирование текста остаются
  # как у дизайнера, меняется только текст. Если клон не подошёл (не нашлась
  # фигура под слот, аудит нашёл ошибку), слайд собирается заново, как
  # раньше. false: всегда собирать заново.
  clone_examples: true

run:
  # Задача H: бюджет времени одного прогона генерации (`workflow.budget.
  # RunBudget`): лимит ТЗ, пять минут на одну презентацию. Обязательные
  # стадии (структура, текст, сборка, детерминированный аудит, экспорт)
  # идут всегда.
  budget_seconds: 300
  # Задача L: режимы прогона — таблица `workflow.budget.RunMode`, выбирается
  # ЦЕЛИКОМ на контрольных точках пайплайна (после write, после compose) по
  # остатку времени на этой точке, а не по стадии отдельно (см. докстроку
  # `RunBudget.decide_mode`). `min_remaining` — от какого остатка времени
  # режим ещё годится; `rerank`/`visual_audit_max_slides` — что режим
  # разрешает необязательным стадиям.
  modes:
    # Хватает на весь rerank-шаг (сам ограничен 40с, `llm.pattern_picker_
    # step_budget_seconds`) плюс сборка трёх вариантов, аудит и экспорт
    # (~40-60с по замерам) — те же 120, что раньше были порогом `rerank_
    # min_remaining`. Аудит по картинке — до 4 самых рискованных слайдов.
    full:
      min_remaining: 120
      rerank: true
      visual_audit_max_slides: 4
    # Времени в обрез: rerank раскладок не идёт (см. докстроку `ModeSpec.
    # rerank` — почему не «частичный», а пропуск). Аудит по картинке
    # (17-46с звонок, замер `audit/visual.py`) — до 2 слайдов, тот же
    # порог 75, что раньше был `visual_audit_min_remaining` (один вызов с
    # запасом на обязательные стадии после).
    fast:
      min_remaining: 75
      rerank: false
      visual_audit_max_slides: 2
    # Меньше 75с осталось — только обязательные стадии, лишь бы получить
    # файл. `min_remaining: 0` — запасной вариант, если остаток уже
    # отрицательный (бюджет превышен).
    emergency:
      min_remaining: 0
      rerank: false
      visual_audit_max_slides: 0
  # С какого балла риска (`audit.risk.pick_risky_slides`, сумма технического
  # и семантического балла, задача L) слайд вообще считается рискованным.
  # Балл 1.0 значит одну заметную примету: собран с нуля, находка уровня
  # major, таблица/график, или один семантический сигнал (заголовок-тема,
  # запасной вариант, цифры без источника, пустые блоки).
  visual_audit_min_risk: 1.0
  # true: рискованные слайды уходят модели одним коллажем с манифестом
  # «номер слайда -> заголовок» (`audit.visual.run_visual_batch`), один
  # вызов вместо N. false: по вызову на слайд, параллельно.
  visual_audit_batch: false
