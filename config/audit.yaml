# Пороги детерминированного аудита (Task 11, Приложение 1 ТЗ, раздел
# «Верификация параметров»). Вынесены из кода отдельным файлом: ТЗ прямо
# разрешает расширять и сокращать набор проверок с обоснованием, и это
# обоснование обязано лежать рядом с числом, а не быть закопанным в diff.
#
# Все проверки читают этот файл через `deckforge.audit.config.AuditConfig.
# load()` — единая точка настройки, тот же принцип, что и `config/app.yaml`.

layout:
  # Порог наложения L02 — доля площади МЕНЬШЕЙ из двух фигур. Замерено на
  # двух блоках 1×1″ вплотную: наезд 0.02″ даёт площадь пересечения 0.02
  # долю меньшего блока (6.7%) — глазом не виден, обычный допуск округления
  # верстки; наезд 0.06″ даёт 20% — уже заметное наложение текста на текст.
  # 0.07 проходит строго между двумя измеренными точками.
  overlap_ratio: 0.07
  # Абсолютный пол площади пересечения (кв. дюйм) — отсекает случай, когда
  # ОДНА из фигур физически крошечная (пиктограмма 0.1×0.1″): у такой пары
  # даже полное перекрытие может остаться в 6-7% площади СЛАЙДА, но доля
  # площади МЕНЬШЕЙ фигуры (см. `overlap_ratio`) уже сработает — этот порог
  # не даёт полностью выродиться пересечению на пиксель-два округления EMU.
  overlap_min_area_in2: 0.01
  # Допуск "контент дошёл до края поля" (L06) — доля ШИРИНЫ холста. 0.5% —
  # на порядок шире погрешности округления EMU↔доля холста (то же
  # соотношение, что `builder._FIT_TOLERANCE_IN` даёт для дюймов), но
  # заметно меньше типичного поля шаблона (3-5% на трёх учебных файлах,
  # см. докстроку `template/grid.py`) — ловит реальное вторжение, а не
  # шум вычислений.
  margin_tolerance: 0.005
  # Допуск выравнивания по восстановленной сетке (L05) — доля ширины
  # холста. Вдвое шире margin_tolerance: сетка (Grid.columns/margin_*) сама
  # по себе получена кластеризацией с погрешностью (см. докстроку grid.py
  # про `_percentile_edge`/кластеры), а не декларативной величиной из XML —
  # проверка выравнивания обязана быть терпимее к этой уже накопленной
  # погрешности мининга, чем проверка полей, которая сравнивает с прямым
  # геометрическим порогом.
  grid_tolerance: 0.008
  # Допуск растяжения картинки (L07) — относительное отклонение
  # placed_aspect/native_aspect от 1.0. 3% — заметно шире погрешности
  # округления EMU при вписывании картинки в слот (доли процента), но
  # заметно уже типичного "испорченного" растяжения (находка `deck_with_
  # picture(native=(800,600), placed=(8in,2in))` даёт отклонение 200%) —
  # не откалибровано под конкретный файл, round-number отсечка на порядок
  # шире шума, на порядок уже брака.

  aspect_tolerance: 0.03

template:
  # WCAG 2.1 AA: обычный текст ≥ 4.5:1, крупный текст ≥ 3:1 (SC 1.4.3).
  min_contrast_small: 4.5
  min_contrast_large: 3.0
  # WCAG-определение "крупного" текста: ≥18pt обычного начертания ИЛИ
  # ≥14pt полужирного (SC 1.4.3, там же).
  large_text_pt: 18
  large_bold_pt: 14
  # Больше двух гарнитур на слайде — уже не дизайн-система, а разнобой;
  # ТЗ дословно "гарнитур больше двух" для T01.
  max_font_families: 2
  # Допуск сравнения кегля со шкалой (T02) — доля пункта. `textfit.measure`
  # и `_shape_dominant_size` (template/patterns.py) сами округляют кегль до
  # ближайших 0.5pt/1px — 0.5pt покрывает это округление и не более.
  size_tolerance_pt: 0.5
  # Допуск смещения логотипа/колонтитула (T05) — доля ширины холста. Вчетверо
  # шире margin_tolerance: логотип/колонтитул — не край текстового блока,
  # сравнение идёт с намайненным (не декларативным) положением
  # `AssetCatalog.logo_placements`, само по себе не идеально точным (Task 6,
  # confidence < 1.0 у части размещений) — 2% ширины холста всё ещё заметно
  # на глаз как "не на месте", но не штрафует субпиксельные расхождения
  # мининга.
  logo_position_tolerance: 0.02

density:
  # ТЗ дословно.
  max_bullets: 6
  max_words_per_bullet: 15
  max_table_rows: 7
  max_table_cols: 5
  max_chart_series: 5
  # ТЗ D05 дословно: "меньше четверти или больше трёх четвертей". Те же
  # числа, что уже использует `compose/builder.py::_FILL_RATIO_MIN/MAX`
  # (Task 9/10) для ранжирования кандидатов паттерна — умышленно один и
  # тот же порог у сборки и у аудита: сборка уже старается не выбирать
  # раскладку, которую аудит потом забракует, разные числа означали бы,
  # что сборка целится в одну мишень, а проверяет код — в другую.
  fill_ratio_min: 0.25
  fill_ratio_max: 0.75

integrity:
  # ТЗ дословно — типовые маркеры незаполненного места в презентациях
  # (рус./англ.), регистронезависимое вхождение подстроки.
  placeholder_patterns: ["lorem ipsum", "XXX", "TODO", "вставьте текст", "текст заголовка", "ваш текст"]
  # Порог схожести текста двух слайдов для I06 (0..1, `difflib.
  # SequenceMatcher.ratio`) — 0.9 означает почти дословное совпадение
  # текста (опечатка/перенос одного слова ещё не дубликат, скопированный
  # слайд с точностью до цифры — уже дубликат); не откалибровано под
  # конкретный корпус, round-number порог "почти идентично".
  duplicate_similarity: 0.9
  # Доля площади холста, которую должна занимать ОДНА картинка, чтобы
  # слайд считался "выгружен целиком растром" (I04) — 90% оставляет запас
  # на рамку/поля вокруг скриншота (слайд редко залит картинкой ровно
  # 100×100%), но исключает картинку, которая просто крупная иллюстрация
  # рядом с текстом, а не подменяет собой весь слайд.
  single_picture_coverage: 0.9
