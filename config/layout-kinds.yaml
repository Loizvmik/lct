# Словарь синонимов имён макетов -> тип (kind), см. task-5-brief.md, Step 2.
#
# Ключ верхнего уровня — kind из закрытого набора layouts.py (KINDS).
# Значение — список подстрок (без учёта регистра), которые ищутся в имени
# макета ПОСЛЕ срезания префикса Google-экспорта `^\d+_` (VK Tech: "1_Контент"
# -> "Контент") и приведения к нижнему регистру. Совпадение — по вхождению
# подстроки, не по регулярному выражению: имена макетов — свободный текст
# дизайнера, не машинный формат, и подстрока устойчивее к опечаткам падежей
# ("Титульный"/"титульного") и к языку (шаблон с защиты может быть не на
# русском — отсюда английские синонимы рядом с русскими в каждой группе).
#
# Если имя подходит под несколько групп сразу (напр. "Титульный слайд
# раздела" — Education, layout7/8/22/23/29/30 — содержит и "титул", и
# "раздел") — это не ошибка словаря, а честная многозначность самого имени;
# layouts.py делит вес имени поровну между всеми совпавшими группами и
# добавляет к этому геометрический сигнал (см. докстроку build_layout_catalog).
#
# Список не обязан покрывать вообще все имена шаблона — макет с именем, не
# нашедшим совпадения ни в одной группе (напр. "N_Визитка" у VK Tech,
# "Демо_1" у контрольного ЛЦТ2026), классифицируется чистой геометрией,
# так и задумано (см. брифом: "ни один сигнал по отдельности не работает",
# не "имя обязано покрыть каждый случай").
#
# Механика сопоставления (находка код-ревью Task 5, п.3): совпадение больше
# не "любая подстрока побеждает", а специфичность по ТЕКСТУ — если короткий
# совпавший паттерн буквально содержится ВНУТРИ другого, более длинного
# совпавшего паттерна ИЗ ДРУГОЙ группы, короткий поглощается и не участвует
# в голосовании (см. `_name_scores` в layouts.py). Ради этого ниже, помимо
# стандартных коротких синонимов, явно перечислены ПОЛНЫЕ стандартные имена
# макетов PowerPoint (англ. и локализованные рус.) — без них "Two Content"
# (содержит "content") побеждала бы как обычный контентный макет, а не как
# двухколоночный, а "Title and Content" (содержит "title") — как титульный.
# Многозначность имени, где ни один совпавший паттерн не substring другого
# ("Титульный слайд раздела" — "титул" и "раздел", независимые), по-прежнему
# честно делит вес между группами, эта механика не меняется.
kinds:
  title:
    - "титул"
    - "обложк"
    - "cover"
    - "title"
    - "title slide"
    - "титульный слайд"
  section:
    - "раздел"
    - "секц"
    - "section"
    - "divider"
    - "section header"
    - "заголовок раздела"
    # "Title Only"/"Только заголовок" — макет из одного заголовка без тела,
    # геометрически неотличим от разделителя (единственный крупный
    # центрированный текстовый блок, см. _HEADING_FAMILY в layouts.py) —
    # ближайший смысловой аналог в закрытом наборе KINDS, не "title"
    # (title — это конкретно обложка колоды, а не любой голый заголовок).
    - "title only"
    - "только заголовок"
  quote:
    - "цитат"
    - "quote"
  kpi:
    - "фактоид"
    - "kpi"
    - "цифр"
    - "статистик"
    - "показател"
    - "метрик"
  image:
    - "фото"
    - "скриншот"
    - "картин"
    - "мокап"
    - "photo"
    - "image"
    - "screenshot"
    - "picture"
    - "picture with caption"
    - "рисунок с подписью"
  table:
    - "таблиц"
    - "table"
  closing:
    - "спасибо"
    - "контакт"
    - "thanks"
    - "closing"
    - "финал"
    - "final"
    - "до встреч"
    - "до связи"
  content:
    - "контент"
    - "content"
    - "содержан"
    - "title and content"
    - "заголовок и объект"
    # "Title and Vertical Text"/"Vertical Title and Text" — заголовок плюс
    # один текстовый блок (вертикальный текст CJK-раскладок) — в закрытом
    # наборе KINDS нет отдельного "вертикального" типа, ближайший
    # содержательный аналог — обычный контентный макет (заголовок + один
    # блок текста), не "title" (это не обложка).
    - "title and vertical text"
    - "заголовок и вертикальный текст"
    - "vertical title and text"
    - "вертикальный заголовок и текст"
  two_col:
    - "две колон"
    - "2 колон"
    - "two col"
    - "2-col"
    - "two content"
    - "два объекта"
    - "comparison"
    - "сравнение"
    # "Content with Caption"/"Объект с подписью" — содержательная область
    # плюс подпись рядом (в PowerPoint это две соседствующие области, не
    # один блок) — структурно двухколоночный макет; подтверждено и
    # геометрией контрольного ЛЦТ2026 (лейаут "Объект с подписью" САМ,
    # чистой геометрией без единого совпадения имени, уже резолвится в
    # two_col — hard evidence непересекающихся колонок).
    - "content with caption"
    - "объект с подписью"
  three_col:
    - "три колон"
    - "3 колон"
    - "three col"
    - "3-col"
  free:
    - "свободн"
    - "free"
    - "custom"
    - "default"
    - "пуст"
    - "blank"
    - "empty"
    - "пустой слайд"
