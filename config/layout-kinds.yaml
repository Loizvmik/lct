# Словарь синонимов имён макетов -> тип (kind), см. task-5-brief.md, Step 2.
#
# Ключ верхнего уровня — kind из закрытого набора layouts.py (KINDS).
# Значение — список подстрок (без учёта регистра), которые ищутся в имени
# макета ПОСЛЕ срезания префикса Google-экспорта `^\d+_` (VK Tech: "1_Контент"
# -> "Контент") и приведения к нижнему регистру. Совпадение — по вхождению
# подстроки, не по регулярному выражению: имена макетов — свободный текст
# дизайнера, не машинный формат, и подстрока устойчивее к опечаткам падежей
# ("Титульный"/"титульного") и к языку (шаблон с защиты может быть не на
# русском — отсюда английские синонимы рядом с русскими в каждой группе).
#
# Если имя подходит под несколько групп сразу (напр. "Титульный слайд
# раздела" — Education, layout7/8/22/23/29/30 — содержит и "титул", и
# "раздел") — это не ошибка словаря, а честная многозначность самого имени;
# layouts.py делит вес имени поровну между всеми совпавшими группами и
# добавляет к этому геометрический сигнал (см. докстроку build_layout_catalog).
#
# Список не обязан покрывать вообще все имена шаблона — макет с именем, не
# нашедшим совпадения ни в одной группе (напр. "N_Визитка" у VK Tech,
# "Демо_1" у контрольного ЛЦТ2026), классифицируется чистой геометрией,
# так и задумано (см. брифом: "ни один сигнал по отдельности не работает",
# не "имя обязано покрыть каждый случай").
kinds:
